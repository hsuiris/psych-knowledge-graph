<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="760" height="466" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="466" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">習得無助實驗的設計（Seligman 與 Maier，1967）</text><text x="170" y="76.0" font-size="15.5" fill="#1e293b" font-weight="600" text-anchor="middle">第一階段：綁在吊帶裡</text><text x="590" y="76.0" font-size="15.5" fill="#1e293b" font-weight="600" text-anchor="middle">第二階段：梭箱</text><text x="590" y="96.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">跳過矮隔板就能逃開電擊</text><rect x="30" y="112" width="280" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="48" y="142.0" font-size="16" fill="#16a34a" font-weight="700" text-anchor="start">可逃脫組</text><text x="48" y="166.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">受到電擊，但按壓面板</text><text x="48" y="185.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">就能讓電擊停止</text><line x1="318" y1="155" x2="432" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="112" width="290" height="86" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="458" y="152.0" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="start">很快學會跳過隔板</text><rect x="30" y="216" width="280" height="86" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="48" y="246.0" font-size="16" fill="#e11d48" font-weight="700" text-anchor="start">無法逃脫組</text><text x="48" y="270.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">受到跟可逃脫組一樣的電擊，</text><text x="48" y="289.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">怎麼做都停不下來</text><line x1="318" y1="259" x2="432" y2="259" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="216" width="290" height="86" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="458" y="256.0" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="start">多數趴著承受，</text><text x="458" y="277.0" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="start">沒有嘗試逃跑</text><rect x="30" y="320" width="280" height="86" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="48" y="350.0" font-size="16" fill="#64748b" font-weight="700" text-anchor="start">對照組</text><text x="48" y="374.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">沒有受到電擊</text><line x1="318" y1="363" x2="432" y2="363" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="320" width="290" height="86" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="458" y="360.0" font-size="14.5" fill="#1e293b" font-weight="500" text-anchor="start">很快學會跳過隔板</text><text x="380" y="446.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">可逃脫組和無法逃脫組受到的電擊總量相同，差別只在「自己能不能控制」。</text></svg>
