<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 420" width="770" height="420" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="770" height="420" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">理情行為治療的 ABCDE</text><rect x="30" y="64" width="220" height="120" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="48" y="98.0" font-size="17" fill="#4338ca" font-weight="700" text-anchor="start">A  引發事件</text><text x="48" y="130.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">報告被主管退回</text><line x1="252" y1="124" x2="273" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="275" y="64" width="220" height="120" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="293" y="98.0" font-size="17" fill="#be123c" font-weight="700" text-anchor="start">B  信念</text><text x="293" y="130.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">「我一定要做到完美，</text><text x="293" y="149.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">不然就是沒用的人」</text><line x1="497" y1="124" x2="518" y2="124" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="64" width="220" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="538" y="98.0" font-size="17" fill="#475569" font-weight="700" text-anchor="start">C  後果</text><text x="538" y="130.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">沮喪、失眠，</text><text x="538" y="149.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">不敢再交報告</text><rect x="275" y="244" width="220" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="293" y="278.0" font-size="17" fill="#15803d" font-weight="700" text-anchor="start">D  駁斥</text><text x="293" y="310.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">「哪條規定說一定要完美？</text><text x="293" y="329.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">被退件就等於沒用嗎？」</text><line x1="385" y1="244" x2="385" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="244" width="220" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="538" y="278.0" font-size="17" fill="#15803d" font-weight="700" text-anchor="start">E  新的效果</text><text x="538" y="310.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">「我希望做好，但被退件只</text><text x="538" y="329.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">代表這份要改」→ 失望，</text><text x="538" y="349.1" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="start">但願意修改</text><line x1="497" y1="304" x2="518" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="400.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">困擾我們的是 B 對 A 的解讀；D 挑戰僵化的「一定要」，E 是換成有彈性的想法之後的新結果。</text></svg>
