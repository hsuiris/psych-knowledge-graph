<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="680" height="450" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="340" y="36.0" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle">操作制約的四種後果</text><text x="245" y="78.0" font-size="16" fill="#1e293b" font-weight="600" text-anchor="middle">給予刺激（正）</text><text x="505" y="78.0" font-size="16" fill="#1e293b" font-weight="600" text-anchor="middle">移除刺激（負）</text><text x="60" y="160.0" font-size="16" fill="#1e293b" font-weight="600" text-anchor="middle">行為</text><text x="60" y="183.2" font-size="16" fill="#1e293b" font-weight="600" text-anchor="middle">變多</text><text x="60" y="320.0" font-size="16" fill="#1e293b" font-weight="600" text-anchor="middle">行為</text><text x="60" y="343.2" font-size="16" fill="#1e293b" font-weight="600" text-anchor="middle">變少</text><rect x="120" y="96" width="250" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="140" y="132.0" font-size="19" fill="#16a34a" font-weight="700" text-anchor="start">正增強</text><text x="140" y="160.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">給予喜歡的東西</text><text x="140" y="190.0" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">例：幫忙做家事，</text><text x="140" y="210.3" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">得到爸媽稱讚</text><rect x="380" y="96" width="250" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="400" y="132.0" font-size="19" fill="#16a34a" font-weight="700" text-anchor="start">負增強</text><text x="400" y="160.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">移除討厭的東西</text><text x="400" y="190.0" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">例：繫上安全帶，</text><text x="400" y="210.3" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">警示聲就停了</text><rect x="120" y="256" width="250" height="140" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="140" y="292.0" font-size="19" fill="#e11d48" font-weight="700" text-anchor="start">正懲罰</text><text x="140" y="320.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">給予討厭的東西</text><text x="140" y="350.0" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">例：上課滑手機，</text><text x="140" y="370.3" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">被老師當眾點名</text><rect x="380" y="256" width="250" height="140" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="400" y="292.0" font-size="19" fill="#e11d48" font-weight="700" text-anchor="start">負懲罰</text><text x="400" y="320.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">移除喜歡的東西</text><text x="400" y="350.0" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">例：晚歸，</text><text x="400" y="370.3" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">被沒收手機一週</text><text x="340" y="430.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">「正」代表加入、「負」代表移除，和好壞無關。負增強會讓行為變多，常被誤認為懲罰。</text></svg>
