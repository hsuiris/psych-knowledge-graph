<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="560" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">改變的階段模式（Prochaska 與 DiClemente）</text><line x1="451" y1="157" x2="485" y2="181" stroke="#64748b" stroke-width="2" stroke-dasharray="0" marker-end="url(#a)"/><line x1="529" y1="317" x2="516" y2="356" stroke="#64748b" stroke-width="2" stroke-dasharray="0" marker-end="url(#a)"/><line x1="401" y1="440" x2="359" y2="440" stroke="#64748b" stroke-width="2" stroke-dasharray="0" marker-end="url(#a)"/><line x1="244" y1="356" x2="231" y2="317" stroke="#64748b" stroke-width="2" stroke-dasharray="0" marker-end="url(#a)"/><line x1="275" y1="181" x2="309" y2="157" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="300.0" y="65.0" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="380.0" y="93.0" font-size="16" fill="#4338ca" font-weight="700" text-anchor="middle">無意圖期</text><text x="380.0" y="113.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">precontemplation</text><text x="380.0" y="133.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">還不覺得有問題</text><rect x="475.9454555146034" y="192.83185604063473" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="555.9454555146034" y="220.8" font-size="16" fill="#4338ca" font-weight="700" text-anchor="middle">意圖期</text><text x="555.9454555146034" y="240.8" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">contemplation</text><text x="555.9454555146034" y="260.8" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">想改又不想改</text><rect x="408.74027167410753" y="399.66814395936524" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="488.74027167410753" y="427.7" font-size="16" fill="#4338ca" font-weight="700" text-anchor="middle">準備期</text><text x="488.74027167410753" y="447.7" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">preparation</text><text x="488.74027167410753" y="467.7" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">打算近期開始</text><rect x="191.25972832589252" y="399.66814395936524" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="271.2597283258925" y="427.7" font-size="16" fill="#4338ca" font-weight="700" text-anchor="middle">行動期</text><text x="271.2597283258925" y="447.7" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">action</text><text x="271.2597283258925" y="467.7" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">開始改變行為</text><rect x="124.05454448539658" y="192.83185604063476" width="160" height="80" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="204.05454448539658" y="220.8" font-size="16" fill="#4338ca" font-weight="700" text-anchor="middle">維持期</text><text x="204.05454448539658" y="240.8" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">maintenance</text><text x="204.05454448539658" y="260.8" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">持續半年以上</text><text x="380" y="286.0" font-size="13" fill="#e11d48" font-weight="600" text-anchor="middle">復發很常見，</text><text x="380" y="306.0" font-size="13" fill="#e11d48" font-weight="600" text-anchor="middle">可以從前面的階段重新開始</text><text x="380" y="540.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">動機式晤談依當事人所在的階段調整做法，例如意圖期著重處理「想改又不想改」的矛盾。</text></svg>
