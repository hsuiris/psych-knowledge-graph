<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="720" height="468" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="360" y="36.0" font-size="20" fill="#1e293b" font-weight="700" text-anchor="middle">焦慮階層：從最不怕的開始練習</text><text x="360" y="60.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">以社交焦慮為例，數字是主觀困擾程度（SUDS，0 到 100 分）</text><rect x="40" y="360" width="450" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="58" y="392.0" font-size="18" fill="#075985" font-weight="700" text-anchor="start">20</text><text x="110" y="392.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">跟便利商店店員說謝謝</text><rect x="68" y="296" width="450" height="50" rx="10" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/><text x="86" y="328.0" font-size="18" fill="#075985" font-weight="700" text-anchor="start">35</text><text x="138" y="328.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">上課時舉手問老師一個問題</text><rect x="96" y="232" width="450" height="50" rx="10" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.5"/><text x="114" y="264.0" font-size="18" fill="#075985" font-weight="700" text-anchor="start">50</text><text x="166" y="264.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">在群組裡主動約朋友吃飯</text><rect x="124" y="168" width="450" height="50" rx="10" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/><text x="142" y="200.0" font-size="18" fill="#075985" font-weight="700" text-anchor="start">70</text><text x="194" y="200.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">小組討論時第一個發言</text><rect x="152" y="104" width="450" height="50" rx="10" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/><text x="170" y="136.0" font-size="18" fill="#075985" font-weight="700" text-anchor="start">90</text><text x="222" y="136.0" font-size="15" fill="#1e293b" font-weight="500" text-anchor="start">在全班面前上台報告</text><line x1="640" y1="400" x2="640" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="658" y="230.0" font-size="15" fill="#64748b" font-weight="600" text-anchor="start">往</text><text x="658" y="251.8" font-size="15" fill="#64748b" font-weight="600" text-anchor="start">上</text><text x="658" y="273.5" font-size="15" fill="#64748b" font-weight="600" text-anchor="start">練</text><text x="658" y="295.2" font-size="15" fill="#64748b" font-weight="600" text-anchor="start">習</text><text x="360" y="448.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">每一階反覆練習，等焦慮明顯下降、不再迴避，再往上一階。</text></svg>
