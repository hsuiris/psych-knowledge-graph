"418.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">陌生人</text><line x1="552" y1="345" x2="568" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="260" width="160" height="170" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/><text x="586" y="292.0" font-size="16" fill="#be185d" font-weight="700" text-anchor="start">8  第二次重聚</text><text x="586" y="322.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">媽媽回來，</text><text x="586" y="341.6" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">陌生人離開</text><circle cx="594" cy="392" r="9" fill="#6366f1"/><text x="594" y="418.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">媽媽</text><circle cx="642" cy="392" r="9" fill="#ec4899"/><text x="642" y="418.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">嬰兒</text><text x="380" y="478.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">除了第 1 段，每段約 3 分鐘；嬰兒太難過時會提早結束。</text><text x="380" y="500.0" font-size="13.5" fill="#be185d" font-weight="600" text-anchor="middle">研究者最看重粉紅框的第 5、8 段：媽媽回來時，嬰兒怎麼反應。</text></svg>
