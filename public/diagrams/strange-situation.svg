ht="400" text-anchor="middle">嬰兒</text><line x1="372" y1="149" x2="388" y2="149" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="64" width="160" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="406" y="96.0" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start">3  陌生人進來</text><text x="406" y="126.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">先安靜坐著，再和</text><text x="406" y="145.6" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">媽媽聊天、接近嬰兒</text><circle cx="414" cy="196" r="9" fill="#6366f1"/><text x="414" y="222.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">媽媽</text><circle cx="462" cy="196" r="9" fill="#ec4899"/><text x="462" y="222.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">嬰兒</text><circle cx="510" cy="196" r="9" fill="#f59e0b"/><text x="510" y="222.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">陌生人</text><line x1="552" y1="149" x2="568" y2="149" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="64" width="160" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="586" y="96.0" font-size="16" fill="#1e293b" font-weight="700" text-anchor="start">4  第一次分離</text><text x="586" y="126.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">媽媽離開，</text><text x="586" y="145.6" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">陌生人陪著嬰兒</text><circle cx="594" cy="196" r="9" fill="#ec4899"/><text x="594" y="222.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">嬰兒</text><circle cx="642" cy="196" r="9" fill="#f59e0b"/><text x="642" y="222.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">陌生人</text><rect x="30" y="260" width="160" height="170" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/><text x="46" y="292.0" font-size="16" fi