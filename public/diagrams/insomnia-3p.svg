<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 566" width="780" height="566" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="780" height="566" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">失眠的 3P 模式（Spielman）</text><rect x="90" y="310" width="90" height="90" fill="#c7d2fe" stroke="#ffffff" stroke-width="2"/><text x="135" y="424.0" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">發病前</text><rect x="240" y="310" width="90" height="90" fill="#c7d2fe" stroke="#ffffff" stroke-width="2"/><rect x="240" y="180" width="90" height="130" fill="#fda4af" stroke="#ffffff" stroke-width="2"/><text x="285" y="424.0" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">急性失眠</text><rect x="390" y="310" width="90" height="90" fill="#c7d2fe" stroke="#ffffff" stroke-width="2"/><rect x="390" y="250" width="90" height="60" fill="#fda4af" stroke="#ffffff" stroke-width="2"/><rect x="390" y="160" width="90" height="90" fill="#fcd34d" stroke="#ffffff" stroke-width="2"/><text x="435" y="424.0" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">開始變慢性</text><rect x="540" y="310" width="90" height="90" fill="#c7d2fe" stroke="#ffffff" stroke-width="2"/><rect x="540" y="160" width="90" height="150" fill="#fcd34d" stroke="#ffffff" stroke-width="2"/><text x="585" y="424.0" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">慢性失眠</text><line x1="70" y1="250" x2="680" y2="250" stroke="#e11d48" stroke-width="2" stroke-dasharray="7 5"/><text x="686" y="255.0" font-size="13" fill="#e11d48" font-weight="600" text-anchor="start">失眠門檻</text><line x1="70" y1="400" x2="680" y2="400" stroke="#cbd5e1" stroke-width="1.5"/><rect x="90" y="443" width="16" height="16" rx="3" fill="#c7d2fe"/><text x="116" y="456.0" font-size="14" fill="#1e293b" font-weight="700" text-anchor="start">前置因素</text><text x="190" y="456.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">天生容易緊張、晚睡型的生理時鐘</text><rect x="90" y="469" width="16" height="16" rx="3" fill="#fda4af"/><text x="116" y="482.0" font-size="14" fill="#1e293b" font-weight="700" text-anchor="start">誘發因素</text><text x="190" y="482.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">考試、失業、生病住院等壓力事件</text><rect x="90" y="495" width="16" height="16" rx="3" fill="#fcd34d"/><text x="116" y="508.0" font-size="14" fill="#1e293b" font-weight="700" text-anchor="start">維持因素</text><text x="190" y="508.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="start">提早上床、白天補眠、躺床滑手機、擔心睡不著</text><text x="380" y="548.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">壓力事件過去了，失眠卻被後來養成的習慣撐住，這就是 CBT-I 處理「維持因素」的原因。</text></svg>
