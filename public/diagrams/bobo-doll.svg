<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="436" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">波波玩偶實驗的流程（Bandura、Ross 與 Ross，1961）</text><text x="150" y="76.0" font-size="15" fill="#1e293b" font-weight="600" text-anchor="middle">1  看大人怎麼玩（約 10 分鐘）</text><rect x="30" y="92" width="250" height="78" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="46" y="120.0" font-size="15.5" fill="#e11d48" font-weight="700" text-anchor="start">攻擊楷模組</text><text x="46" y="144.0" font-size="13" fill="#1e293b" font-weight="400" text-anchor="start">大人對波波玩偶拳打腳踢、</text><text x="46" y="162.8" font-size="13" fill="#1e293b" font-weight="400" text-anchor="start">用木槌敲，邊打邊罵</text><rect x="30" y="184" width="250" height="78" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="46" y="212.0" font-size="15.5" fill="#16a34a" font-weight="700" text-anchor="start">非攻擊楷模組</text><text x="46" y="236.0" font-size="13" fill="#1e293b" font-weight="400" text-anchor="start">大人安靜地組合玩具，</text><text x="46" y="254.8" font-size="13" fill="#1e293b" font-weight="400" text-anchor="start">完全不理會波波玩偶</text><rect x="30" y="276" width="250" height="78" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="46" y="304.0" font-size="15.5" fill="#64748b" font-weight="700" text-anchor="start">控制組</text><text x="46" y="328.0" font-size="13" fill="#1e293b" font-weight="400" text-anchor="start">沒有看到任何大人</text><line x1="290" y1="222" x2="330" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="338" y="150" width="180" height="144" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="428" y="184.0" font-size="15" fill="#a16207" font-weight="700" text-anchor="middle">2  小小挫折</text><text x="428" y="214.0" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="middle">孩子剛開始玩</text><text x="428" y="233.6" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="middle">很好玩的玩具，</text><text x="428" y="253.2" font-size="13.5" fill="#1e293b" font-weight="400" text-anchor="middle">就被收走了</text><line x1="526" y1="222" x2="566" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="574" y="150" width="160" height="144" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="654" y="184.0" font-size="15" fill="#4338ca" font-weight="700" text-anchor="middle">3  自己玩</text><text x="654" y="214.0" font-size="13" fill="#1e293b" font-weight="400" text-anchor="middle">到有波波玩偶的</text><text x="654" y="232.8" font-size="13" fill="#1e293b" font-weight="400" text-anchor="middle">房間玩 20 分鐘，</text><text x="654" y="251.7" font-size="13" fill="#1e293b" font-weight="400" text-anchor="middle">研究者在單面鏡後記錄</text><text x="380" y="392.0" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">結果：看過攻擊楷模的孩子，模仿出許多跟大人一模一樣的動作和罵人的話。</text><text x="380" y="416.0" font-size="13.5" fill="#64748b" font-weight="400" text-anchor="middle">孩子沒有因此得到任何獎勵，說明人光靠「觀察」就能學會新行為。</text></svg>
