<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="460" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">學校的三級輔導（學生輔導法）</text><polygon points="230,64 530,64 600,172 160,172" fill="#fecdd3" stroke="#be123c" stroke-width="1.5"/><text x="380" y="110.0" font-size="16" fill="#be123c" font-weight="700" text-anchor="middle">處遇性輔導</text><text x="380" y="132.0" font-size="12" fill="#1e293b" font-weight="400" text-anchor="middle">對象：介入後仍無法改善、嚴重適應困難或行為偏差的學生</text><text x="380" y="150.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">心理師、社工師等專業輔導人員，結合校外資源</text><polygon points="160,182 600,182 670,290 90,290" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><text x="380" y="228.0" font-size="16" fill="#a16207" font-weight="700" text-anchor="middle">介入性輔導</text><text x="380" y="250.0" font-size="12" fill="#1e293b" font-weight="400" text-anchor="middle">對象：發展性輔導無法滿足需求、適應欠佳或遭遇重大創傷的學生</text><text x="380" y="268.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">輔導教師依個別需求進行個別或團體輔導</text><polygon points="90,300 670,300 740,408 20,408" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/><text x="380" y="346.0" font-size="16" fill="#15803d" font-weight="700" text-anchor="middle">發展性輔導</text><text x="380" y="368.0" font-size="12" fill="#1e293b" font-weight="400" text-anchor="middle">對象：全體學生</text><text x="380" y="386.0" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="middle">全校教師（特別是導師）推動生活、學習與生涯輔導</text><text x="380" y="440.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">越往上，需要的學生越少、介入越密集，也越需要跨專業合作。</text></svg>
