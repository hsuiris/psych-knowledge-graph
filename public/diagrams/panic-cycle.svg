<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 534" width="760" height="534" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="534" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">恐慌的惡性循環（Clark 的認知模式）</text><rect x="275" y="71" width="210" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380" y="101.0" font-size="15.5" fill="#92400e" font-weight="700" text-anchor="middle">察覺到威脅</text><text x="380" y="127.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">「怪怪的，</text><text x="380" y="145.1" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">是不是出事了？」</text><rect x="507.5" y="221" width="210" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="612.5" y="251.0" font-size="15.5" fill="#92400e" font-weight="700" text-anchor="middle">擔心、害怕</text><text x="612.5" y="277.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">焦慮升高</text><rect x="275" y="371" width="210" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380" y="401.0" font-size="15.5" fill="#92400e" font-weight="700" text-anchor="middle">身體感覺變強</text><text x="380" y="427.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">心跳加快、喘不過氣、</text><text x="380" y="445.1" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">頭暈、手麻</text><rect x="42.5" y="221" width="210" height="88" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="147.5" y="251.0" font-size="15.5" fill="#be123c" font-weight="700" text-anchor="middle">災難化解讀</text><text x="147.5" y="277.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">「我要心臟病發作了」</text><text x="147.5" y="295.1" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">「我快昏倒、要失控了」</text><line x1="420" y1="163" x2="502.5" y2="257" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="572.5" y1="313" x2="490" y2="407" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="340" y1="367" x2="257.5" y2="273" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="187.5" y1="217" x2="270" y2="123" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="380" y="492.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">觸發點可以是外在情境（擁擠的捷運），也可以是一個身體感覺（喝咖啡後心跳變快）。</text><text x="380" y="514.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">治療的重點是打斷「災難化解讀」：學會把身體感覺看成無害的焦慮反應，並透過內感暴露親自驗證。</text></svg>
