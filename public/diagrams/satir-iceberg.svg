<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="570" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">薩提爾的冰山</text><rect x="0" y="117" width="760" height="483" fill="#e0f2fe"/><text x="740" y="110.0" font-size="12" fill="#0369a1" font-weight="400" text-anchor="end">水面</text><rect x="190" y="62" width="380" height="52" rx="10" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/><text x="208" y="95.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">行為</text><text x="552" y="95.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">看得到的言行：摔門、不說話</text><rect x="166" y="120" width="428" height="52" rx="10" fill="rgba(255,255,255,0.85)" stroke="#7dd3fc" stroke-width="1.5"/><text x="184" y="153.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">應對</text><text x="576" y="153.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">討好、指責、超理智、打岔或一致</text><rect x="142" y="178" width="476" height="52" rx="10" fill="rgba(255,255,255,0.78)" stroke="#7dd3fc" stroke-width="1.5"/><text x="160" y="211.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">感受</text><text x="600" y="211.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">生氣、受傷、害怕</text><rect x="118" y="236" width="524" height="52" rx="10" fill="rgba(255,255,255,0.71)" stroke="#7dd3fc" stroke-width="1.5"/><text x="136" y="269.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">感受的感受</text><text x="624" y="269.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">「我不該這麼生氣」的羞愧</text><rect x="94" y="294" width="572" height="52" rx="10" fill="rgba(255,255,255,0.64)" stroke="#7dd3fc" stroke-width="1.5"/><text x="112" y="327.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">觀點</text><text x="648" y="327.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">信念與想法：「他根本不在乎我」</text><rect x="70" y="352" width="620" height="52" rx="10" fill="rgba(255,255,255,0.57)" stroke="#7dd3fc" stroke-width="1.5"/><text x="88" y="385.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">期待</text><text x="672" y="385.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">希望對方怎麼做、希望自己怎麼樣</text><rect x="46" y="410" width="668" height="52" rx="10" fill="rgba(255,255,255,0.50)" stroke="#7dd3fc" stroke-width="1.5"/><text x="64" y="443.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">渴望</text><text x="696" y="443.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">被愛、被接納、被認可、有價值</text><rect x="22" y="468" width="716" height="52" rx="10" fill="rgba(255,255,255,0.43)" stroke="#7dd3fc" stroke-width="1.5"/><text x="40" y="501.0" font-size="15" fill="#0c4a6e" font-weight="700" text-anchor="start">自我</text><text x="720" y="501.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="end">生命力、「我是誰」</text><text x="380" y="548.0" font-size="13" fill="#0c4a6e" font-weight="600" text-anchor="middle">只看得到水面上的行為；薩提爾模式從底下一層層往下問，接觸到渴望與自我。</text></svg>
