<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="760" height="550" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="380" y="36.0" font-size="19" fill="#1e293b" font-weight="700" text-anchor="middle">何倫的六角形：六種職業興趣</text><polygon points="380,115 532,202 532,378 380,465 228,378 228,202" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="380" cy="115" r="50" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/><text x="380.0" y="101.0" font-size="14.5" fill="#f59e0b" font-weight="700" text-anchor="middle">R 實用型</text><text x="380.0" y="121.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">動手操作</text><text x="380.0" y="139.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">工程師、廚師</text><circle cx="532" cy="202" r="50" fill="#ffffff" stroke="#10b981" stroke-width="3"/><text x="531.5544456622767" y="188.5" font-size="14.5" fill="#10b981" font-weight="700" text-anchor="middle">I 研究型</text><text x="531.5544456622767" y="208.5" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">分析思考</text><text x="531.5544456622767" y="226.5" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">研究員、醫師</text><circle cx="532" cy="378" r="50" fill="#ffffff" stroke="#ec4899" stroke-width="3"/><text x="531.5544456622767" y="363.5" font-size="14.5" fill="#ec4899" font-weight="700" text-anchor="middle">A 藝術型</text><text x="531.5544456622767" y="383.5" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">創作表達</text><text x="531.5544456622767" y="401.5" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">設計師、作家</text><circle cx="380" cy="465" r="50" fill="#ffffff" stroke="#6366f1" stroke-width="3"/><text x="380.0" y="451.0" font-size="14.5" fill="#6366f1" font-weight="700" text-anchor="middle">S 社會型</text><text x="380.0" y="471.0" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">助人互動</text><text x="380.0" y="489.0" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">諮商師、教師</text><circle cx="228" cy="378" r="50" fill="#ffffff" stroke="#ef4444" stroke-width="3"/><text x="228.44555433772325" y="363.5" font-size="14.5" fill="#ef4444" font-weight="700" text-anchor="middle">E 企業型</text><text x="228.44555433772325" y="383.5" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">說服領導</text><text x="228.44555433772325" y="401.5" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">業務、創業家</text><circle cx="228" cy="202" r="50" fill="#ffffff" stroke="#06b6d4" stroke-width="3"/><text x="228.44555433772325" y="188.5" font-size="14.5" fill="#06b6d4" font-weight="700" text-anchor="middle">C 事務型</text><text x="228.44555433772325" y="208.5" font-size="12.5" fill="#1e293b" font-weight="400" text-anchor="middle">規則秩序</text><text x="228.44555433772325" y="226.5" font-size="11" fill="#64748b" font-weight="400" text-anchor="middle">會計、行政</text><text x="380" y="284.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">相鄰的類型比較相近，</text><text x="380" y="304.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">對角的類型差異最大</text><text x="380" y="530.0" font-size="13" fill="#64748b" font-weight="400" text-anchor="middle">測驗結果通常取分數最高的三型組成代碼，例如 SAE，再找興趣代碼相近的科系與職業。</text></svg>
